name: Build APK

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && (inputs.note != '' && inputs.note || 'Manual build') || format('Build: {0}', github.event.head_commit.message) }}

on:
  workflow_dispatch:      # lets you trigger it manually from the Actions tab
    inputs:
      note:
        description: 'Note for this run (shows as the run name)'
        required: false
        default: ''
  push:
    branches: [ master ]  # also builds automatically on every push to master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;25.2.9519653"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        continue-on-error: true
        run: ./gradlew assembleRelease --stacktrace

      - name: Build debug APK (fallback, no signing needed)
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: diskusage-apks
          path: app/build/outputs/apk/**/*.apk
